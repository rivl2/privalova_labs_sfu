
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодняя ёлка</title>
    <link rel="stylesheet" href="css/style_1.css">
</head>
<body>

    <main class="scene">

        <div class="snow snow-one"></div>
        <div class="snow snow-two"></div>
        <div class="snow snow-three"></div>
        <div class="snow snow-four"></div>
        <div class="snow snow-five"></div>
        <div class="snow snow-six"></div>

        <div class="tree">

            <!-- Звезда -->
            <div class="star"></div>

            <!-- Верхний ярус -->
            <div class="branch branch-top"></div>

            <!-- Средний ярус -->
            <div class="branch branch-middle"></div>

            <!-- Нижний ярус -->
            <div class="branch branch-bottom"></div>

            <!-- Ствол -->
            <div class="trunk"></div>

            <!-- Игрушки -->
            <div class="decoration red decoration-one"></div>
            <div class="decoration gold decoration-two"></div>
            <div class="decoration blue decoration-three"></div>
            <div class="decoration red decoration-four"></div>
            <div class="decoration gold decoration-five"></div>
            <div class="decoration blue decoration-six"></div>
            <div class="decoration red decoration-seven"></div>
            <div class="decoration gold decoration-eight"></div>
            <div class="decoration blue decoration-nine"></div>

        </div>

        <!-- Сугроб -->
        <div class="snow-ground"></div>


    </main>

</body>
</html>
