
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Песочные часы</title>
    <link rel="stylesheet" href="css/style_2.css">
</head>
<body>

    <main class="scene">

     

        <div class="hourglass">

            <div class="top-frame"></div>
            <div class="bottom-frame"></div>

            <div class="glass">

                <div class="glass-shine shine-left"></div>
                <div class="glass-shine shine-right"></div>

                <div class="top-chamber">
                    <div class="sand-top"></div>
                </div>

                <div class="bottom-chamber">
                    <div class="sand-bottom"></div>
                </div>

                <div class="sand-stream"></div>

                <div class="sand-grain grain-one"></div>
                <div class="sand-grain grain-two"></div>
                <div class="sand-grain grain-three"></div>

            </div>

        </div>

   

    </main>

</body>
</html>
