<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вариант 2</title>
    <link rel="stylesheet" href="css/style_2.css">
</head>
<body>

    <main class="container">

        <!-- 320px -->
        <section class="layout mobile">

            <div class="figure mobile-first">
                <div class="cell c-indianred" style="grid-column: 1 / 9;"></div>
                <div class="cell c-darkred" style="grid-column: 9 / 13;"></div>
            </div>

            <div class="figure mobile-second">
                <div class="cell c-pink" style="grid-column: 1 / 13;"></div>
                <div class="cell c-hotpink" style="grid-column: 1 / 13;"></div>
                <div class="cell c-mediumvioletred" style="grid-column: 1 / 13; grid-row: 3 / 5;"></div>
            </div>

            <div class="figure mobile-green">
                <div class="cell c-greenyellow" style="grid-column: 1 / 5;"></div>
                <div class="cell c-lime" style="grid-column: 5 / 9;"></div>
                <div class="cell c-limegreen" style="grid-column: 9 / 13;"></div>

                <div class="cell c-mediumspringgreen" style="grid-column: 1 / 7;"></div>
                <div class="cell c-darkgreen" style="grid-column: 7 / 13;"></div>

                <div class="cell c-seagreen" style="grid-column: 1 / 7;"></div>
                <div class="cell c-yellowgreen" style="grid-column: 7 / 13;"></div>

                <div class="cell c-olive" style="grid-column: 1 / 7;"></div>
                <div class="cell c-mediumaquamarine" style="grid-column: 7 / 13;"></div>
            </div>

            <div class="figure mobile-fourth">
                <div class="cell c-lightsalmon" style="grid-column: 1 / 4;"></div>
                <div class="cell c-orangered" style="grid-column: 4 / 7;"></div>
                <div class="cell c-orange" style="grid-column: 7 / 13;"></div>
            </div>

            <div class="figure mobile-brown">
                <div class="cell crosybrown"></div>
                <div class="cell c-sandybrown"></div>
                <div class="cell c-chocolate"></div>
                <div class="cell c-saddlebrown"></div>
                <div class="cell c-brown"></div>
                <div class="cell c-maroon"></div>
            </div>

        </section>


        <!-- 768px -->
        <section class="layout tablet">

            <div class="figure tablet-first">
                <div class="cell c-indianred" style="grid-column: 1 / 7;"></div>
                <div class="cell c-darkred" style="grid-column: 7 / 13;"></div>
            </div>

            <div class="figure tablet-second">
                <div class="cell c-pink" style="grid-column: 1 / 7;"></div>
                <div class="cell c-hotpink" style="grid-column: 1 / 7;"></div>
                <div class="cell c-mediumvioletred" style="grid-column: 7 / 13; grid-row: 1 / 3;"></div>
            </div>

            <div class="figure tablet-green">
                <div class="cell c-greenyellow" style="grid-column: 1 / 5;"></div>
                <div class="cell c-lime" style="grid-column: 5 / 9;"></div>
                <div class="cell c-limegreen" style="grid-column: 9 / 13;"></div>

                <div class="cell c-mediumspringgreen" style="grid-column: 1 / 4;"></div>
                <div class="cell c-darkgreen" style="grid-column: 4 / 7;"></div>
                <div class="cell c-olive" style="grid-column: 7 / 10;"></div>
                <div class="cell c-darkolivegreen" style="grid-column: 10 / 13;"></div>

                <div class="cell c-seagreen" style="grid-column: 1 / 4;"></div>
                <div class="cell c-yellowgreen" style="grid-column: 4 / 7;"></div>
                <div class="cell c-mediumaquamarine" style="grid-column: 7 / 10;"></div>
                <div class="cell c-teal" style="grid-column: 10 / 13;"></div>
            </div>

            <div class="figure tablet-fourth">
                <div class="cell" style="grid-column: 1 / 2;"></div>
                <div class="cell c-lightsalmon" style="grid-column: 2 / 4;"></div>
                <div class="cell" style="grid-column: 4 / 5;"></div>
                <div class="cell c-orangered" style="grid-column: 5 / 7;"></div>
                <div class="cell" style="grid-column: 7 / 8;"></div>
                <div class="cell c-orange" style="grid-column: 8 / 12;"></div>
                <div class="cell" style="grid-column: 12 / 13;"></div>
            </div>

            <div class="figure tablet-brown">
                <div class="cell c-chocolate" style="grid-column: 1 / 3; grid-row: 1 / 3;"></div>
                <div class="cell c-saddlebrown" style="grid-column: 3 / 5; grid-row: 1 / 3;"></div>
                <div class="cell c-brown" style="grid-column: 5 / 7; grid-row: 1 / 3;"></div>
                <div class="cell c-maroon" style="grid-column: 7 / 9; grid-row: 1 / 3;"></div>
                <div class="cell crosybrown" style="grid-column: 9 / 13; grid-row: 1;"></div>
                <div class="cell c-sandybrown" style="grid-column: 9 / 13; grid-row: 2;"></div>
            </div>

        </section>


        <!-- 1200px -->
        <section class="layout desktop">

            <div class="figure desktop-first">
                <div class="cell c-indianred" style="grid-column: 1 / 4;"></div>
                <div class="cell c-crimson" style="grid-column: 4 / 7;"></div>
                <div class="cell c-darkred" style="grid-column: 7 / 13;"></div>
            </div>

            <div class="figure desktop-second">
                <div class="cell c-pink" style="grid-column: 1 / 5;"></div>
                <div class="cell c-hotpink" style="grid-column: 5 / 13;"></div>
                <div class="cell c-mediumvioletred" style="grid-column: 1 / 13;"></div>
            </div>

            <div class="figure desktop-green">

                <div class="cell c-greenyellow" style="grid-column: 1 / 4; grid-row: 1;"></div>
                <div class="cell c-lime" style="grid-column: 1 / 4; grid-row: 2;"></div>
                <div class="cell c-limegreen" style="grid-column: 1 / 4; grid-row: 3;"></div>

                <div class="green-right">

                    <div class="cell c-mediumspringgreen" style="grid-column: 1; grid-row: 1;"></div>
                    <div class="cell c-seagreen" style="grid-column: 1; grid-row: 2 / 4;"></div>

                    <div class="cell c-darkgreen" style="grid-column: 2; grid-row: 1 / 3;"></div>
                    <div class="cell c-yellowgreen" style="grid-column: 2; grid-row: 3;"></div>

                    <div class="cell c-olive" style="grid-column: 3; grid-row: 1;"></div>
                    <div class="cell c-mediumaquamarine" style="grid-column: 3; grid-row: 2 / 4;"></div>

                    <div class="cell c-darkolivegreen" style="grid-column: 4; grid-row: 1 / 3;"></div>
                    <div class="cell c-teal" style="grid-column: 4; grid-row: 3;"></div>

                </div>
            </div>

            <div class="figure desktop-fourth">
                <div class="cell" style="grid-column: 1 / 2;"></div>
                <div class="cell c-lightsalmon" style="grid-column: 2 / 3;"></div>
                <div class="cell" style="grid-column: 3 / 5;"></div>
                <div class="cell c-orangered" style="grid-column: 5 / 6;"></div>
                <div class="cell" style="grid-column: 6 / 8;"></div>
                <div class="cell c-orange" style="grid-column: 8 / 12;"></div>
                <div class="cell" style="grid-column: 12 / 13;"></div>
            </div>

            <div class="figure desktop-brown">
                <div class="cell c-chocolate" style="grid-column: 1 / 4; grid-row: 1;"></div>
                <div class="cell c-brown" style="grid-column: 1 / 4; grid-row: 2;"></div>

                <div class="cell c-saddlebrown" style="grid-column: 4 / 7; grid-row: 1;"></div>
                <div class="cell c-maroon" style="grid-column: 4 / 7; grid-row: 2;"></div>

                <div class="cell crosybrown" style="grid-column: 7 / 10; grid-row: 1 / 3;"></div>
                <div class="cell c-sandybrown" style="grid-column: 10 / 13; grid-row: 1 / 3;"></div>
            </div>

        </section>

    </main>

</body>
</html>
